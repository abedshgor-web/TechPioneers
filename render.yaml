services:
  - type: web
    name: copytrade-pro
    runtime: node
    branch: claude/trade-copying-platform-beXwU
    buildCommand: npm install && cd client && npm install && npm run build && cd .. && cd server && npm install && npm run build
    startCommand: cd server && node dist/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.11.0"
