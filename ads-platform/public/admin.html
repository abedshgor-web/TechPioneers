<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المدير — منصّة الإعلانات</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="/">منصّة الإعلانات · الإدارة</a>
      <nav class="nav-links">
        <span id="who" class="muted"></span>
        <button id="logoutBtn" class="btn btn-ghost" style="display:none">خروج</button>
      </nav>
    </div>
  </header>

  <!-- دخول المدير -->
  <div id="authView" class="auth-wrap">
    <div class="panel">
      <h2>دخول المدير</h2>
      <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" /></div>
      <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" /></div>
      <div class="error" id="authError"></div>
      <button id="loginBtn" class="btn btn-primary full">دخول</button>
    </div>
  </div>

  <!-- لوحة الإدارة -->
  <div id="adminView" class="dash" style="display:none">
    <div class="statbar">
      <div class="stat"><div class="num" id="advertisers">—</div><div class="lbl">المعلنون</div></div>
      <div class="stat"><div class="num" id="activeCampaigns">—</div><div class="lbl">حملات نشطة</div></div>
      <div class="stat"><div class="num" id="pendingAds">—</div><div class="lbl">إعلانات للمراجعة</div></div>
      <div class="stat"><div class="num" id="totalSpend">—</div><div class="lbl">إجمالي الإنفاق</div></div>
      <div class="stat"><div class="num" id="totalTopups">—</div><div class="lbl">إجمالي الشحن</div></div>
      <div class="stat"><div class="num" id="blockedClicks">—</div><div class="lbl">نقرات محجوبة</div></div>
    </div>

    <h2 style="margin:24px 0 12px">طابور مراجعة الإعلانات</h2>
    <table class="table">
      <thead><tr><th>المعلن</th><th>الحملة</th><th>العنوان</th><th>الوجهة</th><th>القرار</th></tr></thead>
      <tbody id="reviewRows"><tr><td colspan="5" class="muted">لا توجد إعلانات للمراجعة.</td></tr></tbody>
    </table>

    <h2 style="margin:34px 0 12px">المستخدمون</h2>
    <table class="table">
      <thead><tr><th>البريد</th><th>الدور</th><th>الحالة</th><th>الرصيد</th><th>إجراء</th></tr></thead>
      <tbody id="userRows"><tr><td colspan="5" class="muted">—</td></tr></tbody>
    </table>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
