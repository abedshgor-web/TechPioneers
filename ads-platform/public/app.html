<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المعلِن — منصّة الإعلانات</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="/">منصّة الإعلانات</a>
      <nav class="nav-links">
        <span id="who" class="muted"></span>
        <button id="logoutBtn" class="btn btn-ghost" style="display:none">خروج</button>
      </nav>
    </div>
  </header>

  <!-- شاشة المصادقة -->
  <div id="authView" class="auth-wrap">
    <div class="panel">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <div class="error" id="authError"></div>
      <button id="submitBtn" class="btn btn-primary full">دخول</button>
      <p class="muted" style="margin-top:16px">
        <span id="toggleText">ليس لديك حساب؟</span>
        <button id="toggleBtn" class="link">أنشئ حساباً</button>
      </p>
    </div>
  </div>

  <!-- لوحة المعلن -->
  <div id="dashView" class="dash" style="display:none">
    <div class="statbar">
      <div class="stat"><div class="num" id="balance">—</div><div class="lbl">الرصيد المتاح</div></div>
      <div class="stat"><div class="num" id="campCount">—</div><div class="lbl">عدد الحملات</div></div>
      <div class="stat"><div class="num" id="activeCount">—</div><div class="lbl">حملات نشطة</div></div>
    </div>

    <div class="row-actions">
      <button id="topupBtn" class="btn btn-ghost">+ شحن 50.00 (تجريبي)</button>
      <button id="newCampBtn" class="btn btn-primary">+ حملة جديدة</button>
    </div>

    <table class="table">
      <thead>
        <tr><th>الحملة</th><th>الحالة</th><th>الميزانية الإجمالية</th><th>CPC الأقصى</th><th>إجراء</th></tr>
      </thead>
      <tbody id="campRows">
        <tr><td colspan="5" class="muted">لا توجد حملات بعد.</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/app.js"></script>
</body>
</html>
